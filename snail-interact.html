<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蜗牛互动</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        html,body{height:100%;}
        body{
            width:100vw;height:100vh;
            overflow:hidden;
            font-family:sans-serif;
            background-image:url("img/snail-illustration.jpg");
            background-size:cover;
            background-position:center;
        }
        .back-btn{
            position:absolute;
            top:20px;left:20px;
            font-size:18px;
            color:#fff;
            z-index:999;
            background:rgba(0,0,0,0.45);
            padding:8px 16px;
            border-radius:20px;
            text-decoration:none;
        }
        .back-photo{
            position:absolute;
            top:20px;right:20px;
            font-size:18px;
            color:#fff;
            z-index:999;
            background:rgba(0,0,0,0.45);
            padding:8px 16px;
            border-radius:20px;
            text-decoration:none;
        }
        .action-video{
            position:absolute;
            top:0;left:0;
            width:100vw;height:100vh;
            object-fit:cover;
            z-index:8;
            display:none;
        }
        .hotspot{
            position:absolute;
            background:transparent;
            z-index:9;
        }
        /* 头（吃）：左79% 上35% */
        .eat-hotspot{ left:79%; top:35%; width:9%; height:15%; cursor:pointer; }
        /* 脚（睡）：左62% 上50% */
        .sleep-hotspot{ left:62%; top:50%; width:12%; height:15%; cursor:pointer; }
        .tip{
            position:absolute;
            bottom:6%;left:50%;transform:translateX(-50%);
            color:#fff;font-size:14px;text-shadow:0 1px 4px rgba(0,0,0,0.6);
            z-index:10;pointer-events:none;
        }
    </style>
</head>
<body class="interact-page" id="snailInteract">
    <a href="snail.html" class="back-btn">返回放大镜</a >
    <a href="lake.html" class="back-photo">回栖息地</a >
    <video class="action-video" id="actionVideo" muted></video>

    <div class="hotspot eat-hotspot" onclick="playAction('eat')"></div>
    <div class="hotspot sleep-hotspot" onclick="playAction('sleep')"></div>

    <div class="tip">点嘴=动起来 · 点脚=躺下 · 再点空白恢复</div>

    <script>
        var video = document.getElementById('actionVideo');

        function playAction(type){
            if (type === 'eat') {
                video.src = 'video/snail-eat.mp4';
                video.loop = true;
            } else {
                video.src = 'video/snail-sleep.mp4';
                video.loop = false;
            }
            video.style.display = 'block';
            video.play();
        }

        document.addEventListener('click', function(e){
            if (e.target.classList.contains('hotspot') || e.target.classList.contains('back-btn') || e.target.classList.contains('back-photo')) return;
            video.pause();
            video.style.display = 'none';
            video.loop = false;
        });
    </script>
</body>
</html>
