<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企鹅1互动</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        html,body{height:100%;}
        body{
            width:100vw;height:100vh;
            overflow:hidden;
            font-family:sans-serif;
            background-image:url("img/penguin1-illustration.jpg");
            background-size:cover;
            background-position:center;
        }
        .back-btn{
            position:absolute;
            top:20px;left:20px;
            font-size:18px;
            color:#fff;
            z-index:999;
            background:rgba(0,0,0,0.45);
            padding:8px 16px;
            border-radius:20px;
            text-decoration:none;
        }
        .back-photo{
            position:absolute;
            top:20px;right:20px;
            font-size:18px;
            color:#fff;
            z-index:999;
            background:rgba(0,0,0,0.45);
            padding:8px 16px;
            border-radius:20px;
            text-decoration:none;
        }
        /* 全屏视频：和背景一样大，铺满整个页面 */
        .action-video{
            position:absolute;
            top:0;left:0;
            width:100vw;height:100vh;
            object-fit:cover;   /* 铺满且不拉伸变形 */
            z-index:8;
            display:none;
        }
        /* 两个透明块 */
        .hotspot{
            position:absolute;
            background:transparent;
            z-index:9;
        }
        /* 嘴（吃） */
        .eat-hotspot{ width:260px; height:120px; top:35%; left:25%; cursor:pointer; }
        /* 地上（睡） */
        .sleep-hotspot{ width:160px; height:140px; top:70%; left:28%; cursor:pointer; }
        .tip{
            position:absolute;
            bottom:6%;left:50%;transform:translateX(-50%);
            color:#fff;font-size:14px;text-shadow:0 1px 4px rgba(0,0,0,0.6);
            z-index:10;pointer-events:none;
        }
    </style>
</head>
<body class="interact-page" id="penguin1Interact">
    <a href="penguin1.html" class="back-btn">返回放大镜</a >
    <a href="glacier.html" class="back-photo">回栖息地</a >
    <video class="action-video" id="actionVideo" muted></video>

    <div class="hotspot eat-hotspot" onclick="playAction('eat')"></div>
    <div class="hotspot sleep-hotspot" onclick="playAction('sleep')"></div>

    <div class="tip">点嘴=动起来 · 点脚=躺下 · 再点空白恢复</div>

    <script>
        var video = document.getElementById('actionVideo');

        function playAction(type){
            if (type === 'eat') {
                video.src = 'video/penguin1-eat.mp4';
                video.loop = true;      // 吃：循环动起来
            } else {
                video.src = 'video/penguin1-sleep.mp4';
                video.loop = false;     // 睡：躺下定格
            }
            video.style.display = 'block';
            video.play();
        }

        // 再点一下（空白处）恢复背景页原样
        document.addEventListener('click', function(e){
            if (e.target.classList.contains('hotspot') || e.target.classList.contains('back-btn') || e.target.classList.contains('back-photo')) return;
            video.pause();
            video.style.display = 'none';
            video.loop = false;
        });
    </script>
</body>
</html>
