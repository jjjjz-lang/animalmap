<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>森林栖息地</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        html,body{height:100%;}
        body{
            width:100vw;height:100vh;
            overflow:hidden;
            font-family:sans-serif;
            background-image:url("img/forest-bg-photo.jpg");
            background-size:cover;
            background-position:center;
        }

        .back-btn{
            position:absolute;
            top:20px;left:20px;
            font-size:18px;
            color:#fff;
            z-index:999;
            background:rgba(0,0,0,0.45);
            padding:8px 16px;
            border-radius:20px;
            text-decoration:none;
        }

        /* ===== 放大镜 ===== */
        .lens{
            position:absolute;
            width:280px;
            height:280px;
            border-radius:50%;
            background-image:url("img/forest-bg-illustration.jpg");
            background-repeat:no-repeat;
            background-position:0px 0px;
            box-shadow:0 0 0 4px rgba(255,255,255,0.95),0 12px 30px rgba(0,0,0,0.5);
            pointer-events:none;
            opacity:0;
            transform:translate(-50%,-50%);
            transition:opacity .15s ease;
            z-index:2;
        }
        body.lens-on .lens{ opacity:1; }

        /* ===== 透明按键 ===== */
        .hotspot{
            position:absolute;
            cursor:pointer;
            border:none;
            background:transparent;
            z-index:6;
        }
        /* 小鸟：左侧中间位置，往下挪 */
        .bird{ width:400px; height:360px; top:38%; left:0%; }
        /* 狐狸 */
        .fox{ width:290px; height:220px; top:50%; left:38%; }
        /* 大象 */
        .elephant{ width:400px; height:320px; top:48%; left:52%; }
        /* 猫头鹰 */
        .owl{ width:240px; height:190px; top:16%; left:68%; }
        /* 树蛙 */
        .treefrog{ width:230px; height:190px; top:76%; left:76%; }
    </style>
</head>
<body class="page-forest" id="forestPage">
    <a href="animalMap.html" class="back-btn">返回</a >

    <div class="lens" id="lens"></div>

    <!-- 五个透明按键 -->
    <div class="hotspot bird" onclick="location.href='bird.html'"></div>
    <div class="hotspot fox" onclick="location.href='fox.html'"></div>
    <div class="hotspot elephant" onclick="location.href='elephant.html'"></div>
    <div class="hotspot owl" onclick="location.href='owl.html'"></div>
    <div class="hotspot treefrog" onclick="location.href='treefrog.html'"></div>

    <script>
        var lens = document.getElementById('lens');
        var body = document.getElementById('forestPage');
        var lensSize = 280;

        var vw = window.innerWidth;
        var vh = window.innerHeight;
        lens.style.backgroundSize = vw + 'px ' + vh + 'px';

        window.addEventListener('mousemove', function(e){
            lens.style.left = e.clientX + 'px';
            lens.style.top  = e.clientY + 'px';

            var bgX = (lensSize / 2) - e.clientX;
            var bgY = (lensSize / 2) - e.clientY;
            lens.style.backgroundPosition = bgX + 'px ' + bgY + 'px';

            body.classList.add('lens-on');
        });

        document.addEventListener('mouseleave', function(){
            body.classList.remove('lens-on');
        });
    </script>
</body>
</html>
